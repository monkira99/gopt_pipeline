# ============================================================================
# Stage 2: Best Baseline (KoelLabs-80d + WavLM-32 stack + Utterance-Prosody)
# ============================================================================

experiment_name: "stage2_baseline_wavlm32"

dataset:
  train: "data/gopt_vh_scripted_gold/train.npz"
  test: "data/gopt_vh_scripted_gold/test_unseen_speakers.npz"
  val: "data/gopt_vh_scripted_gold/val.npz"
  scale: "0-100"

features:
  acoustic_model: "KoelLabs/xlsr-english-01"
  gop_map: "koel"
  use_occ: false
  use_prosody: false
  utt_prosody: true        # Bơm 8-d prosody riêng vào nhánh Utterance
  use_wavlm: true          # Bật WavLM SSL
  wavlm_dim: 32            # Sweet-spot chống overfit (PCA 32-d)
  wavlm_fuse: "stack"      # Concat 80d + 32d = 112d vào encoder

model:
  model: "gopt"
  arch: "base"
  embed_dim: 24
  depth: 3
  heads: 1
  dropout: 0.20
  noise: 0.10

training:
  epochs: 80
  bs: 25
  lr: 0.001
  wd: 0.0001
  sched: "cosine"
  w_phn: 1.0
  w_word: 1.0
  w_utt: 1.0
  best_metric: "mean"
  seed: 0

logging:
  out: "ckpt/stage2_baseline_wavlm32"
  wandb_project: "gopt-vh-experiments"
  wandb_run: "stage2-baseline-wavlm32"
  no_wandb: false
