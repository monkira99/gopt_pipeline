# ============================================================================
# UNIFIED + prosody-vào-TOKEN: giống unified.yaml nhưng đưa dur+eng (8-d) vào token phone
# (use_prosody=true) THAY VÌ vào nhánh utt (utt_prosody=false) — 2 chế độ loại trừ nhau
# (assert "pick one prosody mode"). Mục đích: đo lever probe đã có (sub_recall 0.638) vs base.
# ============================================================================

experiment_name: "unified_prosody"

dataset:
  hf_dataset: "tiennguyenbnbk/gopt-vh-gold-features-v3"   # v3: occ đã điền; dur/eng có sẵn
  train: "train"
  val: "val"
  test: "test_unseen_speakers"
  test2: "test_unseen_prompts"
  scale: "0-100"

features:
  acoustic_model: "KoelLabs/xlsr-english-01"
  gop_map: "koel"
  use_occ: false
  use_prosody: true         # dur+eng -> token phone
  utt_prosody: false        # TẮT prosody ở nhánh utt (loại trừ với use_prosody)
  use_wavlm: true
  wavlm_dim: 32
  wavlm_fuse: "stack"

model:
  arch: "base"
  embed_dim: 48
  depth: 4
  heads: 4
  dropout: 0.20
  noise: 0.10

training:
  epochs: 80
  bs: 25
  lr: 0.001
  wd: 0.0001
  sched: "cosine"
  w_phn: 1.0
  w_word: 1.0
  w_utt: 1.0
  no_word_head: true
  w_det: 1.0
  w_diag: 1.0
  w_cons: 0.0
  det_wpow: 0.5
  best_metric: "unified"
  early_stop_patience: 12
  early_stop_threshold: 0.0
  seed: 0

logging:
  out: "ckpt/unified_prosody"
  wandb_project: "gopt-vh-experiments"
  wandb_run: "unified-prosody"
  no_wandb: true
  push_model: false
